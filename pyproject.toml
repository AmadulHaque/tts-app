[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kokoro-studio"
version = "0.1.0"
description = "Kokoro Studio — a desktop app for generating two-person podcast-style English conversations with the Kokoro TTS engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "PySide6>=6.7",
    "kokoro>=0.9.4",
    "misaki[en]",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pydub>=0.25",
    "pyloudnorm>=0.1.1",
    "espeakng-loader>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
